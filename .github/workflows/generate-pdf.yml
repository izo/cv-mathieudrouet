name: Generate CV PDFs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/content/cv/**'
      - 'src/components/**'
      - 'src/layouts/**'
      - 'src/styles/**'
      - 'src/config/**'
      - 'scripts/generate-pdf.mjs'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: write

concurrency:
  group: cv-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - name: Start preview server
        run: |
          bun run preview --host 127.0.0.1 --port 4321 > /tmp/cv-preview.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4321/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cv-preview.log
          exit 1
      - run: bun run pdf:generate
      - name: Commit generated PDFs
        run: |
          git add public/CV-Mathieu-Drouet-FR.pdf public/CV-Mathieu-Drouet-EN.pdf
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate CV PDFs"
          git push
